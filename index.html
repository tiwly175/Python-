<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เรียนPython by.Patcharaphon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Fira+Code:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0E13;
    --bg-elev: #10161D;
    --bg-elev2: #141C24;
    --ink: #D9E6E0;
    --ink-dim: #7E8F8A;
    --ink-faint: #4E5C58;
    --line: #1D2830;
    --line-bright: #2A3942;
    --green: #3EE08C;
    --green-dim: #1E5C43;
    --magenta: #FF5FA8;
    --magenta-dim: #5C2340;
    --amber: #FFC24B;
    --amber-dim: #5C4318;
    --code-bg: #060A0D;
    --shadow: 0 8px 30px rgba(0,0,0,0.45);
    --glow-green: 0 0 0 1px rgba(62,224,140,0.4), 0 0 18px rgba(62,224,140,0.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Sarabun', 'Noto Sans Thai', sans-serif;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    position: relative;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.012) 0px,
      rgba(255,255,255,0.012) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
  }
  .mono, code, pre { font-family: 'Fira Code', ui-monospace, monospace; }
  ::selection { background: var(--green-dim); color: var(--ink); }

  /* ---------- Layout shell ---------- */
  .app { display: flex; min-height: 100vh; }

  .topbar { display: none; }

  .sidebar {
    width: 320px;
    flex-shrink: 0;
    background: var(--bg-elev);
    border-right: 1px solid var(--line);
    padding: 0;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .term-head {
    padding: 18px 20px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-elev2);
  }
  .term-dots { display: flex; gap: 6px; margin-bottom: 14px; }
  .term-dots span { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .term-dots span:nth-child(1) { background: #FF5F57; }
  .term-dots span:nth-child(2) { background: #FEBC2E; }
  .term-dots span:nth-child(3) { background: #28C840; }
  .brand { display: flex; align-items: baseline; gap: 9px; margin-bottom: 3px; }
  .brand .leaf { font-size: 18px; }
  .brand h1 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: 0.2px; font-family: 'Fira Code', monospace; color: var(--ink); }
  .brand-sub { font-size: 12px; color: var(--ink-dim); margin: 0; font-family: 'Fira Code', monospace; }
  .brand-sub .cursor { display: inline-block; width: 7px; height: 13px; background: var(--green); margin-right: 2px; vertical-align: -2px; animation: blink 1.1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .progress-wrap { padding: 14px 20px; border-bottom: 1px solid var(--line); }
  .progress-label {
    display: flex; justify-content: space-between;
    font-size: 11.5px; color: var(--ink-dim); margin-bottom: 7px;
    font-family: 'Fira Code', monospace;
  }
  .progress-track { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--magenta)); border-radius: 3px; transition: width 0.5s ease; box-shadow: 0 0 8px rgba(62,224,140,0.5); }

  .nav-scroll { padding: 10px 12px 30px; overflow-y: auto; flex: 1; }

  .module-block { margin-bottom: 3px; }
  .module-head {
    width: 100%;
    background: none; border: none;
    text-align: right;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 11px 8px;
    cursor: pointer;
    color: var(--ink);
    font-family: inherit;
    border-radius: 6px;
  }
  .module-head:hover { background: var(--bg-elev2); }
  .module-head-text { text-align: left; }
  .module-num { font-size: 10.5px; color: var(--green); display: block; font-family: 'Fira Code', monospace; letter-spacing: 0.5px; }
  .module-title { font-size: 14px; font-weight: 600; }
  .module-caret { color: var(--ink-faint); transition: transform 0.2s ease; flex-shrink: 0; font-family: monospace; }
  .module-block.open .module-caret { transform: rotate(90deg); color: var(--green); }

  .lesson-list { list-style: none; margin: 2px 0 10px; padding: 0 0 0 4px; display: none; border-right: 1px solid var(--line); margin-right: 12px; }
  .module-block.open .lesson-list { display: block; }

  .lesson-item button {
    width: 100%; text-align: right;
    background: none; border: none; font-family: 'Fira Code', monospace;
    font-size: 12.5px; color: var(--ink-dim);
    padding: 8px 14px 8px 8px; border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; gap: 9px; justify-content: flex-end;
  }
  .lesson-item button:hover { background: var(--bg-elev2); color: var(--ink); }
  .lesson-item.active button { background: var(--green-dim); color: var(--green); font-weight: 600; }
  .lesson-fname { direction: ltr; }
  .lesson-item.done .lesson-fname::after { content: " ✓"; color: var(--green); }

  /* ---------- Main content ---------- */
  .main { flex: 1; min-width: 0; padding: 0 0 100px; max-width: 800px; }
  .status-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 16px 44px; border-bottom: 1px solid var(--line);
    font-family: 'Fira Code', monospace; font-size: 11.5px; color: var(--ink-dim);
    background: linear-gradient(180deg, rgba(62,224,140,0.04), transparent);
  }
  .status-bar b { color: var(--green); font-weight: 600; }

  .content-pad { padding: 34px 44px 0; }

  .crumb { font-size: 12px; color: var(--ink-dim); margin: 0 0 10px; font-family: 'Fira Code', monospace; }
  .crumb .sep { color: var(--ink-faint); margin: 0 6px; }

  .lesson-title {
    font-size: 28px; font-weight: 700; margin: 0 0 6px; line-height: 1.4;
    display: flex; align-items: baseline; gap: 4px;
  }
  .lesson-title .cursor { display: inline-block; width: 10px; height: 24px; background: var(--magenta); animation: blink 1.1s step-end infinite; }
  .lesson-tagline { color: var(--ink-dim); font-size: 14.5px; margin: 0 0 30px; }

  .section-label {
    display: flex; align-items: center; gap: 8px;
    font-family: 'Fira Code', monospace; font-size: 11.5px;
    letter-spacing: 0.5px; color: var(--green);
    margin: 34px 0 12px;
  }
  .section-label::before { content: "//"; color: var(--ink-faint); }

  .lesson-body p { margin: 0 0 16px; font-size: 16px; }
  .lesson-body ul { margin: 0 0 16px; padding-right: 20px; font-size: 16px; }
  .lesson-body li { margin-bottom: 7px; }
  .lesson-body b { color: var(--magenta); font-weight: 600; }

  .term-window {
    border-radius: 10px;
    border: 1px solid var(--line-bright);
    overflow: hidden;
    margin: 16px 0 26px;
    box-shadow: var(--shadow);
    background: var(--code-bg);
  }
  .term-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px; background: var(--bg-elev2);
    border-bottom: 1px solid var(--line);
  }
  .term-bar .term-dots span { width: 8px; height: 8px; }
  .term-bar .fname { font-family: 'Fira Code', monospace; font-size: 11.5px; color: var(--ink-dim); }
  .term-body {
    padding: 18px 20px; overflow-x: auto;
    font-size: 13.5px; line-height: 1.75; white-space: pre; color: var(--ink);
  }
  .term-body .cmt { color: var(--ink-faint); }
  .term-body .str { color: var(--amber); }
  .example-note { font-size: 13.5px; color: var(--ink-dim); margin: -14px 0 26px; padding-right: 4px; border-right: 2px solid var(--green-dim); padding-right: 12px; }

  .callout {
    border: 1px solid var(--amber-dim);
    background: rgba(255,194,75,0.06);
    border-radius: 10px;
    padding: 15px 19px;
    margin: 22px 0;
    font-size: 14.5px;
  }
  .callout b { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; color: var(--amber); font-weight: 600; }

  .tech-list { list-style: none; margin: 0 0 30px; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .tech-list li {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 12px 16px;
    font-size: 14.5px;
    display: flex; gap: 10px;
  }
  .tech-list li::before { content: "▸"; color: var(--green); flex-shrink: 0; }

  .practice-card {
    margin-top: 30px;
    background: linear-gradient(160deg, rgba(255,95,168,0.07), rgba(62,224,140,0.05));
    border: 1px solid var(--line-bright);
    border-radius: 14px;
    padding: 22px 24px;
  }
  .practice-eyebrow { font-family: 'Fira Code', monospace; font-size: 11.5px; color: var(--magenta); margin: 0 0 8px; letter-spacing: 0.5px; }
  .practice-text { font-size: 15px; margin: 0; }

  .lesson-nav {
    display: flex; justify-content: space-between; align-items: center;
    margin: 40px 44px 0; gap: 10px; padding-top: 20px; border-top: 1px solid var(--line);
  }
  .nav-btn {
    font-family: 'Fira Code', monospace; font-size: 13px; font-weight: 500;
    padding: 11px 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line-bright); background: var(--bg-elev); color: var(--ink);
  }
  .nav-btn:hover:not(:disabled) { border-color: var(--green); color: var(--green); }
  .nav-btn.primary { background: var(--green-dim); border-color: var(--green); color: var(--green); box-shadow: var(--glow-green); }
  .nav-btn.primary:hover:not(:disabled) { filter: brightness(1.15); }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }

  /* ---------- Mobile ---------- */
  @media (max-width: 860px) {
    .app { flex-direction: column; }
    .sidebar { position: static; width: 100%; height: auto; display: none; border-right: none; border-bottom: 1px solid var(--line); }
    .sidebar.open { display: flex; max-height: 70vh; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 16px; background: var(--bg-elev); border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 5;
    }
    .topbar .brand { margin: 0; }
    .menu-toggle {
      background: var(--bg-elev2); border: 1px solid var(--line-bright); color: var(--green);
      font-family: 'Fira Code', monospace; font-size: 12.5px; padding: 8px 13px; border-radius: 7px; cursor: pointer;
    }
    .content-pad { padding: 26px 20px 0; }
    .status-bar { padding: 13px 20px; }
    .lesson-nav { margin: 34px 20px 0; }
    .lesson-title { font-size: 22px; }
  }

  /* ================================================================
     HACKER-MODE ADD-ONS: boot sequence, matrix rain, terminal, toasts
     ================================================================ */

  /* ---------- Matrix rain background ---------- */
  #matrixCanvas {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    opacity: 0; transition: opacity 1.2s ease;
  }
  #matrixCanvas.on { opacity: 0.10; }
  .app { position: relative; z-index: 1; }

  /* ---------- Boot screen ---------- */
  #bootScreen {
    position: fixed; inset: 0; z-index: 1000;
    background: #05080A;
    color: var(--green);
    font-family: 'Fira Code', monospace;
    display: flex; flex-direction: column;
    padding: 26px 26px 20px;
    overflow: hidden;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  #bootScreen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #bootLog {
    flex: 1; overflow-y: auto; font-size: 12.5px; line-height: 1.9;
    white-space: pre-wrap; word-break: break-word;
  }
  #bootLog .ln { opacity: 0; animation: lnIn 0.15s ease forwards; }
  #bootLog .ok { color: var(--green); }
  #bootLog .dim { color: var(--ink-faint); }
  #bootLog .warn { color: var(--amber); }
  #bootLog .tag { color: var(--magenta); }
  @keyframes lnIn { to { opacity: 1; } }
  .boot-caret { display: inline-block; width: 7px; height: 13px; background: var(--green); vertical-align: -2px; animation: blink 1.1s step-end infinite; }
  #bootSkip {
    align-self: flex-end;
    margin-top: 14px;
    background: none; border: 1px solid var(--line-bright); color: var(--ink-dim);
    font-family: 'Fira Code', monospace; font-size: 11px; padding: 7px 12px; border-radius: 6px;
    cursor: pointer;
  }
  #bootSkip:hover { color: var(--green); border-color: var(--green); }

  /* ---------- Glitch text ---------- */
  .glitch { position: relative; display: inline-block; }
  .glitch.glitching::before,
  .glitch.glitching::after {
    content: attr(data-text);
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    overflow: hidden; background: transparent;
  }
  .glitch.glitching::before {
    color: var(--magenta);
    clip-path: inset(0 0 60% 0);
    animation: glitchTop 0.35s steps(2, end) 2;
    transform: translate(-2px, -1px);
  }
  .glitch.glitching::after {
    color: var(--green);
    clip-path: inset(60% 0 0 0);
    animation: glitchBot 0.35s steps(2, end) 2;
    transform: translate(2px, 1px);
  }
  @keyframes glitchTop { 0% { transform: translate(-2px,-1px);} 50% { transform: translate(3px,-2px);} 100% { transform: translate(-1px,0);} }
  @keyframes glitchBot { 0% { transform: translate(2px,1px);} 50% { transform: translate(-3px,2px);} 100% { transform: translate(1px,0);} }

  /* ---------- HUD (time / system status) ---------- */
  .hud {
    display: flex; align-items: center; gap: 10px;
    font-family: 'Fira Code', monospace; font-size: 10.5px; color: var(--ink-faint);
    padding: 10px 20px; border-top: 1px solid var(--line);
    flex-wrap: wrap;
  }
  .hud .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 6px var(--green); flex-shrink: 0; }
  .hud span.sep { color: var(--ink-faint); }

  /* ---------- Terminal launcher + panel ---------- */
  #termLauncher {
    position: fixed; right: 20px; bottom: 20px; z-index: 60;
    width: 46px; height: 46px; border-radius: 10px;
    background: var(--bg-elev2); border: 1px solid var(--line-bright); color: var(--green);
    font-family: 'Fira Code', monospace; font-size: 17px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: var(--shadow);
  }
  #termLauncher:hover { border-color: var(--green); box-shadow: var(--glow-green); }
  #termLauncher .blip { position: absolute; top: -3px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--magenta); box-shadow: 0 0 6px var(--magenta); display: none; }

  #termPanel {
    position: fixed; right: 20px; bottom: 78px; z-index: 60;
    width: 380px; max-width: calc(100vw - 40px);
    height: 320px; max-height: 60vh;
    background: var(--code-bg); border: 1px solid var(--line-bright); border-radius: 12px;
    box-shadow: var(--shadow);
    display: none; flex-direction: column; overflow: hidden;
    font-family: 'Fira Code', monospace;
  }
  #termPanel.open { display: flex; }
  .term-panel-bar { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--bg-elev2); border-bottom: 1px solid var(--line); }
  .term-panel-bar .fname { font-size: 11px; color: var(--ink-dim); }
  .term-panel-bar .term-close { margin-right: auto; margin-left: 0; }
  .term-close { background: none; border: none; color: var(--ink-faint); cursor: pointer; font-size: 13px; padding: 2px 6px; }
  .term-close:hover { color: var(--magenta); }
  #termOutput { flex: 1; overflow-y: auto; padding: 12px 14px; font-size: 12px; line-height: 1.75; color: var(--ink); }
  #termOutput .out-line { white-space: pre-wrap; word-break: break-word; margin-bottom: 3px; }
  #termOutput .in-echo { color: var(--green); }
  #termOutput .in-echo::before { content: "$ "; color: var(--ink-faint); }
  #termOutput .out-err { color: var(--magenta); }
  #termOutput .out-dim { color: var(--ink-faint); }
  .term-panel-input { display: flex; align-items: center; gap: 7px; border-top: 1px solid var(--line); padding: 9px 12px; }
  .term-panel-input .prompt { color: var(--green); font-size: 12.5px; }
  .term-panel-input input {
    flex: 1; background: none; border: none; outline: none; color: var(--ink);
    font-family: 'Fira Code', monospace; font-size: 12.5px;
  }

  /* ---------- Toasts ---------- */
  #toastStack {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    z-index: 200; display: flex; flex-direction: column; gap: 8px;
    width: min(360px, calc(100vw - 32px)); pointer-events: none;
  }
  .toast {
    background: var(--bg-elev2); border: 1px solid var(--line-bright); border-radius: 9px;
    padding: 11px 14px; box-shadow: var(--shadow);
    font-family: 'Fira Code', monospace; font-size: 12px; color: var(--ink);
    display: flex; align-items: flex-start; gap: 9px;
    opacity: 0; transform: translateY(-10px);
    animation: toastIn 0.35s ease forwards;
    border-right: 3px solid var(--green);
  }
  .toast.warn { border-right-color: var(--amber); }
  .toast.tag { border-right-color: var(--magenta); }
  .toast .toast-ic { flex-shrink: 0; }
  .toast.leaving { animation: toastOut 0.3s ease forwards; }
  @keyframes toastIn { to { opacity: 1; transform: translateY(0); } }
  @keyframes toastOut { to { opacity: 0; transform: translateY(-8px) scale(0.97); } }

  @media (max-width: 860px) {
    #termPanel { right: 12px; left: 12px; width: auto; bottom: 74px; }
    #termLauncher { right: 16px; bottom: 16px; }
  }
</style>
</head>
<body>

<canvas id="matrixCanvas"></canvas>

<div id="bootScreen">
  <div id="bootLog"></div>
  <button id="bootSkip">ข้าม [ANY KEY]</button>
</div>

<div id="toastStack"></div>

<button id="termLauncher" title="เปิดเทอร์มินัล (หรือกด `)"><span class="mono">&gt;_</span><span class="blip" id="termBlip"></span></button>
<div id="termPanel">
  <div class="term-panel-bar">
    <button class="term-close" id="termClose">✕</button>
    <div class="term-dots"><span></span><span></span><span></span></div>
    <span class="fname">~/python-from-zero — sh</span>
  </div>
  <div id="termOutput"></div>
  <div class="term-panel-input">
    <span class="prompt">$</span>
    <input id="termInput" type="text" autocomplete="off" spellcheck="false" placeholder="พิมพ์ help แล้ว Enter">
  </div>
</div>

<div class="app">
  <div class="topbar">
    
    <div class="brand" style="display: flex; align-items: center; gap: 8px;"><span class="leaf">🐍</span><img src="output-image.png" style="height: 22px; width: 22px; border-radius: 50%; object-fit: cover;" alt="icon"><h1 style="margin: 0;">py_by.Patcharaphon</h1></div>
    
    <button class="menu-toggle" id="menuToggle">☰ สารบัญ</button>
  </div>

  <nav class="sidebar" id="sidebar">
    <div class="term-head">
      <div class="term-dots"><span></span><span></span><span></span></div>
      
      <div class="brand" style="display: flex; align-items: center; gap: 8px;"><span class="leaf">🐍</span><img src="output-image.png" style="height: 22px; width: 22px; border-radius: 50%; object-fit: cover;" alt="icon"><h1 class="glitch" id="brandTitle" data-text="py_by.Patcharaphon" style="margin: 0;">py_by.Patcharaphon</h1></div>
      
      <p class="brand-sub"><span class="cursor"></span>~/python-from-zero</p>
    </div>

    <div class="progress-wrap">
      <div class="progress-label">
        <span>progress.log</span>
        <span id="progressText">0/0 บทเรียน</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>

    <div class="nav-scroll" id="moduleNav"></div>

    <div class="hud">
      <span class="dot"></span>
      <span id="hudClock">--:--:--</span>
      <span class="sep">·</span>
      <span>uptime <span id="hudUptime">0m</span></span>
      <span class="sep">·</span>
      <span>node #py-01</span>
    </div>
  </nav>

  <main class="main" id="main"></main>
</div>

<script>
/* ================= Course data ================= */
const COURSE = [
  {
    title: "เริ่มต้นกับ Python", file: "01_เริ่มต้น",
    lessons: [
      {
        id: "1-1", file: "intro.py", title: "Python คืออะไร ทำไมต้องเรียน",

/* ================= App state ================= */
let currentId = COURSE[0].lessons[0].id;
let completed = [];
try {
  const saved = localStorage.getItem("py-by.Patcharaphon-progress-v2");
  if (saved) completed = JSON.parse(saved);
} catch (e) { completed = []; }

function saveProgress() {
  try { localStorage.setItem("py-by.Patcharaphon-progress-v2", JSON.stringify(completed)); }
  catch (e) { /* storage unavailable, continue without persistence */ }
}
function flatLessons() { return COURSE.flatMap(m => m.lessons); }
function findLesson(id) {
  for (const m of COURSE) {
    const l = m.lessons.find(x => x.id === id);
    if (l) return { lesson: l, module: m };
  }
  return null;
}
function moduleIndexOfLesson(id) { return COURSE.findIndex(m => m.lessons.some(l => l.id === id)); }

let openModules = new Set([moduleIndexOfLesson(currentId)]);

/* ================= Sidebar render ================= */
function renderSidebar() {
  const nav = document.getElementById("moduleNav");
  nav.innerHTML = "";
  COURSE.forEach((m, mi) => {
    const block = document.createElement("div");
    block.className = "module-block" + (openModules.has(mi) ? " open" : "");

    const head = document.createElement("button");
    head.className = "module-head";
    head.innerHTML = `<span class="module-caret">›</span><span class="module-head-text"><span class="module-num">${m.file}/</span><span class="module-title">${m.title}</span></span>`;
    head.addEventListener("click", () => {
      if (openModules.has(mi)) openModules.delete(mi); else openModules.add(mi);
      renderSidebar();
    });
    block.appendChild(head);

    const ul = document.createElement("ul");
    ul.className = "lesson-list";
    m.lessons.forEach(l => {
      const li = document.createElement("li");
      li.className = "lesson-item" + (l.id === currentId ? " active" : "") + (completed.includes(l.id) ? " done" : "");
      const btn = document.createElement("button");
      btn.innerHTML = `<span class="lesson-fname">${l.file}</span>`;
      btn.addEventListener("click", () => { goTo(l.id); closeMobileSidebar(); });
      li.appendChild(btn);
      ul.appendChild(li);
    });
    block.appendChild(ul);
    nav.appendChild(block);
  });

  const total = flatLessons().length;
  const done = completed.length;
  document.getElementById("progressText").textContent = done + "/" + total + " บทเรียน";
  document.getElementById("progressFill").style.width = (total ? (done / total * 100) : 0) + "%";
}

/* ================= Main content render ================= */
function renderMain() {
  const { lesson, module } = findLesson(currentId);
  const mi = moduleIndexOfLesson(currentId);
  const all = flatLessons();
  const idx = all.findIndex(l => l.id === currentId);
  const prev = all[idx - 1];
  const next = all[idx + 1];

  const examplesHtml = lesson.examples.map(ex => `
    <div class="term-window">
      <div class="term-bar"><div class="term-dots"><span></span><span></span><span></span></div><span class="fname">${ex.label}</span></div>
      <div class="term-body">${ex.code}</div>
    </div>
    ${ex.note ? `<p class="example-note">${ex.note}</p>` : ""}
  `).join("");

  const techHtml = lesson.techniques.map(t => `<li>${t}</li>`).join("");

  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="status-bar">
      <span>โมดูล <b>${mi + 1}</b>/${COURSE.length} · บท <b>${idx + 1}</b>/${all.length}</span>
      <span>${completed.includes(lesson.id) ? "● จบแล้ว" : "○ ยังไม่จบ"}</span>
    </div>
    <div class="content-pad">
      <p class="crumb">${module.file}<span class="sep">/</span>${lesson.file}</p>
      <h2 class="lesson-title glitch" data-text="${lesson.title}">${lesson.title}<span class="cursor"></span></h2>
      <p class="lesson-tagline">${lesson.tagline}</p>

      <div class="lesson-body">${lesson.body}</div>

      <p class="section-label">ตัวอย่างการใช้งาน</p>
      ${examplesHtml}

      ${lesson.callout ? `<div class="callout"><b>⚠ จุดที่มือใหม่พลาดบ่อย</b>${lesson.callout}</div>` : ""}

      <p class="section-label">เทคนิคที่ควรรู้</p>
      <ul class="tech-list">${techHtml}</ul>

      <div class="practice-card">
        <p class="practice-eyebrow">$ ลองด้วยตัวเอง</p>
        <p class="practice-text">${lesson.practice}</p>
      </div>
    </div>
    <div class="lesson-nav">
      <button class="nav-btn" id="prevBtn" ${prev ? "" : "disabled"}>‹ บทก่อนหน้า</button>
      <button class="nav-btn primary" id="doneBtn">${completed.includes(lesson.id) ? "✓ เรียนจบแล้ว" : "ทำเครื่องหมายว่าเรียนจบ"}</button>
      <button class="nav-btn" id="nextBtn" ${next ? "" : "disabled"}>บทถัดไป ›</button>
    </div>
  `;

  document.getElementById("doneBtn").addEventListener("click", () => {
    if (!completed.includes(lesson.id)) {
      completed.push(lesson.id);
      saveProgress();
      renderSidebar();
      document.getElementById("doneBtn").textContent = "✓ เรียนจบแล้ว";
      triggerGlitch(document.querySelector(".lesson-title.glitch"));
      showToast({ text: `${lesson.file} บันทึกแล้ว — ความคืบหน้าอัปเดต`, kind: "ok", icon: "✓" });

      const moduleDone = module.lessons.every(l => completed.includes(l.id));
      if (moduleDone) {
        setTimeout(() => {
          showToast({ text: `โมดูล "${module.title}" เคลียร์ครบแล้ว — ไปต่อโมดูลถัดไปได้เลย`, kind: "tag", icon: "🏆" });
        }, 650);
      }
      if (completed.length === all.length) {
        setTimeout(() => {
          showToast({ text: `จบคอร์สแล้ว! ยินดีด้วย นักพัฒนา — ไปดูขั้นตอนถัดไปได้ในบทสุดท้าย`, kind: "tag", icon: "🐍" });
        }, 1200);
      }
    }
  });
  if (prev) document.getElementById("prevBtn").addEventListener("click", () => goTo(prev.id));
  if (next) document.getElementById("nextBtn").addEventListener("click", () => goTo(next.id));

  window.scrollTo({ top: 0, behavior: "auto" });
}

function goTo(id) {
  currentId = id;
  openModules.add(moduleIndexOfLesson(id));
  renderSidebar();
  renderMain();
}
function closeMobileSidebar() { document.getElementById("sidebar").classList.remove("open"); }

document.getElementById("menuToggle").addEventListener("click", () => {
  document.getElementById("sidebar").classList.toggle("open");
});

renderSidebar();
renderMain();

/* ---------- Glitch helper ---------- */
function triggerGlitch(el) {
  if (!el) return;
  el.classList.remove("glitching");
  void el.offsetWidth; /* restart animation */
  el.classList.add("glitching");
  setTimeout(() => el.classList.remove("glitching"), 380);
}
setInterval(() => {
  const t = document.getElementById("brandTitle");
  if (t && Math.random() < 0.5) triggerGlitch(t);
}, 9000);

/* ---------- Toasts ---------- */
function showToast({ text, kind = "ok", icon = "●", timeout = 4200 }) {
  const stack = document.getElementById("toastStack");
  const el = document.createElement("div");
  el.className = "toast" + (kind === "warn" ? " warn" : kind === "tag" ? " tag" : "");
  el.innerHTML = `<span class="toast-ic">${icon}</span><span>${text}</span>`;
  stack.appendChild(el);
  const remove = () => {
    el.classList.add("leaving");
    setTimeout(() => el.remove(), 280);
  };
  setTimeout(remove, timeout);
}

/* ---------- HUD clock ---------- */
const hudStart = performance.now();
function fmtClock(d) {
  return [d.getHours(), d.getMinutes(), d.getSeconds()].map(n => String(n).padStart(2, "0")).join(":");
}
function tickHud() {
  const clockEl = document.getElementById("hudClock");
  const upEl = document.getElementById("hudUptime");
  if (clockEl) clockEl.textContent = fmtClock(new Date());
  if (upEl) {
    const mins = Math.floor((performance.now() - hudStart) / 60000);
    const secs = Math.floor(((performance.now() - hudStart) % 60000) / 1000);
    upEl.textContent = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
  }
}
tickHud();
setInterval(tickHud, 1000);

/* ---------- Matrix rain ---------- */
const matrixCanvas = document.getElementById("matrixCanvas");
const mctx = matrixCanvas.getContext("2d");
let matrixOn = false;
let matrixCols = [];
const matrixChars = "アイウエオカキクケコサシスセソ01ABCDEFGHIJKLMNOPQRSTUVWXYZ$#@%+-<>/{}[]()".split("");

function resizeMatrix() {
  matrixCanvas.width = window.innerWidth;
  matrixCanvas.height = window.innerHeight;
  const fontSize = 15;
  const cols = Math.ceil(matrixCanvas.width / fontSize);
  matrixCols = new Array(cols).fill(0).map(() => Math.floor(Math.random() * -40));
}
window.addEventListener("resize", resizeMatrix);
resizeMatrix();

function drawMatrix() {
  if (!matrixOn) return;
  const fontSize = 15;
  mctx.fillStyle = "rgba(5,8,10,0.14)";
  mctx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
  mctx.font = fontSize + "px 'Fira Code', monospace";
  for (let i = 0; i < matrixCols.length; i++) {
    const ch = matrixChars[Math.floor(Math.random() * matrixChars.length)];
    const x = i * fontSize;
    const y = matrixCols[i] * fontSize;
    mctx.fillStyle = Math.random() < 0.04 ? "#D9E6E0" : "#3EE08C";
    mctx.fillText(ch, x, y);
    if (y > matrixCanvas.height && Math.random() > 0.975) matrixCols[i] = 0;
    matrixCols[i]++;
  }
  requestAnimationFrame(drawMatrix);
}
function setMatrix(on) {
  matrixOn = on;
  matrixCanvas.classList.toggle("on", on);
  if (on) { mctx.fillStyle = "#05080A"; mctx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height); drawMatrix(); }
}

/* ---------- Terminal ---------- */
const termPanel = document.getElementById("termPanel");
const termOutput = document.getElementById("termOutput");
const termInput = document.getElementById("termInput");
const termBlip = document.getElementById("termBlip");
let termOpenedOnce = false;

function termPrint(text, cls) {
  const div = document.createElement("div");
  div.className = "out-line" + (cls ? " " + cls : "");
  div.textContent = text;
  termOutput.appendChild(div);
  termOutput.scrollTop = termOutput.scrollHeight;
}
function termPrintEcho(text) {
  const div = document.createElement("div");
  div.className = "out-line in-echo";
  div.textContent = text;
  termOutput.appendChild(div);
  termOutput.scrollTop = termOutput.scrollHeight;
}
function openTerm() {
  termPanel.classList.add("open");
  termBlip.style.display = "none";
  if (!termOpenedOnce) {
    termOpenedOnce = true;
    termPrint("py_by.Patcharaphon terminal v2.0 — พิมพ์ 'help' เพื่อดูคำสั่งทั้งหมด", "out-dim");
  }
  setTimeout(() => termInput.focus(), 50);
}
function closeTerm() { termPanel.classList.remove("open"); }

document.getElementById("termLauncher").addEventListener("click", () => {
  termPanel.classList.contains("open") ? closeTerm() : openTerm();
});
document.getElementById("termClose").addEventListener("click", closeTerm);
document.addEventListener("keydown", (e) => {
  if (e.key === "`" && document.activeElement !== termInput) {
    e.preventDefault();
    termPanel.classList.contains("open") ? closeTerm() : openTerm();
  }
  if (e.key === "Escape" && termPanel.classList.contains("open")) closeTerm();
});

const TERM_HELP = [
  "help              แสดงคำสั่งทั้งหมด",
  "whoami            ข้อมูลผู้ใช้ปัจจุบัน",
  "ls                รายชื่อโมดูลทั้งหมด",
  "progress          ความคืบหน้าการเรียน",
  "matrix on|off     เปิด/ปิดฝนดิจิทัลพื้นหลัง",
  "goto <id>         กระโดดไปบทเรียน เช่น goto 2-1",
  "clear             ล้างหน้าจอเทอร์มินัล",
  "theme <สี>        magenta / amber / green (เปลี่ยนสีเน้น)",
  "sudo <อะไรก็ได้>   ลองดูสิ",
  "exit              ปิดเทอร์มินัล"
];
function handleTermCommand(raw) {
  const cmd = raw.trim();
  termPrintEcho(cmd);
  if (!cmd) return;
  const [word, ...rest] = cmd.split(/\s+/);
  const arg = rest.join(" ");

  switch (word.toLowerCase()) {
    case "help":
      TERM_HELP.forEach(l => termPrint(l, "out-dim"));
      break;
    case "whoami":
      termPrint("นักเรียน@python-from-zero — สิทธิ์: ผู้เรียนรู้ (ไม่ใช่ root, ยังไม่ต้อง sudo จริง ๆ)");
      break;
    case "ls":
      COURSE.forEach(m => termPrint(m.file + "/    " + m.title));
      break;
    case "pwd":
      termPrint("/home/student/python-from-zero");
      break;
    case "progress": {
      const total = flatLessons().length;
      const done = completed.length;
      termPrint(`เรียนไปแล้ว ${done}/${total} บท (${total ? Math.round(done/total*100) : 0}%)`);
      break;
    }
    case "clear":
      termOutput.innerHTML = "";
      break;
    case "matrix":
      if (arg === "off") { setMatrix(false); termPrint("ปิดฝนดิจิทัลแล้ว", "out-dim"); }
      else { setMatrix(true); termPrint("เปิดฝนดิจิทัลพื้นหลัง — พิมพ์ 'matrix off' เพื่อปิด", "out-dim"); }
      break;
    case "goto": {
      const found = findLesson(arg);
      if (found) { goTo(arg); termPrint(`ไปยังบท ${arg}: ${found.lesson.title}`); closeMobileSidebar(); }
      else termPrint(`ไม่พบบทเรียน id "${arg}" — ลองพิมพ์ ls เพื่อดูโมดูล`, "out-err");
      break;
    }
    case "theme": {
      const map = { magenta: "#FF5FA8", amber: "#FFC24B", green: "#3EE08C" };
      if (map[arg]) {
        document.documentElement.style.setProperty("--green", map[arg]);
        termPrint(`เปลี่ยนสีเน้นเป็น ${arg} แล้ว`);
        showToast({ text: `ธีมสีอัปเดตเป็น ${arg}`, kind: "tag", icon: "🎨" });
      } else termPrint("ใช้ได้แค่: theme magenta / theme amber / theme green", "out-err");
      break;
    }
    case "sudo":
      if (/make me a sandwich/i.test(arg)) termPrint("Okay.  (ทำแซนวิชให้ ทันทีเพราะพิมพ์ sudo)", "out-dim");
      else termPrint(`sudo: ${arg || "??"}: คุณไม่ได้อยู่ใน sudoers file — เหตุการณ์นี้จะถูกรายงาน (ไม่จริงหรอก)`, "out-err");
      break;
    case "exit":
      closeTerm();
      break;
    case "echo":
      termPrint(arg);
      break;
    default:
      termPrint(`command not found: ${word} — พิมพ์ help เพื่อดูคำสั่งที่ใช้ได้`, "out-err");
  }
}
termInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && termInput.value.trim() !== "") {
    handleTermCommand(termInput.value);
    termInput.value = "";
  }
});

/* ping the terminal launcher once to invite exploration */
setTimeout(() => { if (!termPanel.classList.contains("open")) termBlip.style.display = "block"; }, 4000);
</script>
