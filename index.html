<style>
:root{--bg:#0A0E13;--bg2:#10161D;--bg3:#141C24;--ink:#D9E6E0;--dim:#7E8F8A;--faint:#4E5C58;--line:#1D2830;--line2:#2A3942;--green:#3EE08C;--gdim:#1E5C43;--mag:#FF5FA8;--mdim:#5C2340;--amb:#FFC24B;--adim:#5C4318;--code:#060A0D;--sh:0 8px 30px rgba(0,0,0,.45)}
[data-theme=light]{--bg:#F4F7F5;--bg2:#FFF;--bg3:#EDF3EF;--ink:#16211C;--dim:#5C6B65;--faint:#8C9A94;--line:#DDE5E0;--line2:#C1CDC6;--green:#0E9B58;--gdim:#C8F0DB;--mag:#C73578;--amb:#A87818;--adim:#F5E4B8;--code:#EFF4F1}
[data-theme=light] body::before{display:none}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Sarabun,sans-serif;line-height:1.8;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:999;background:repeating-linear-gradient(to bottom,rgba(255,255,255,.012) 0,rgba(255,255,255,.012) 1px,transparent 1px,transparent 3px);mix-blend-mode:overlay}

.term-dots{display:flex;gap:6px;margin-bottom:14px}.term-dots span{width:9px;height:9px;border-radius:50%}
.term-dots span:nth-child(1){background:#FF5F57}.term-dots span:nth-child(2){background:#FEBC2E}.term-dots span:nth-child(3){background:#28C840}
.brand{display:flex;align-items:baseline;gap:9px;margin-bottom:3px}.brand .leaf{font-size:18px}
.brand h1{font-size:16px;font-weight:700;margin:0;font-family:'Fira Code',monospace}

.cursor{display:inline-block;width:7px;height:13px;background:var(--green);margin-right:2px;vertical-align:-2px;animation:blink 1.1s step-end infinite}

.filter-btn{flex:1;background:var(--bg3);border:1px solid var(--line);color:var(--dim);font-family:'Fira Code',monospace;font-size:10.5px;padding:6px;border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}

.nav-scroll{padding:10px 12px 30px;overflow-y:auto;flex:1}

.lesson-item button:hover{background:var(--bg3);color:var(--ink)}
.lesson-item.active button{background:var(--gdim);color:var(--green);font-weight:600}
.lesson-item.filtered-out{display:none}.lesson-fname{direction:ltr}
.lesson-item.done .lesson-fname::after{content:" ✓";color:var(--green)}

.main{flex:1;min-width:0;padding:0 0 100px;max-width:800px}

.status-bar b{color:var(--green);font-weight:600}

.section-label{display:flex;align-items:center;gap:8px;font-family:'Fira Code',monospace;font-size:11.5px;color:var(--green);margin:34px 0 12px}

.lesson-body p{margin:0 0 16px;font-size:16px}.lesson-body ul{margin:0 0 16px;padding-right:20px;font-size:16px}
.lesson-body li{margin-bottom:7px}.lesson-body b{color:var(--mag);font-weight:600}
.term-window{border-radius:10px;border:1px solid var(--line2);overflow:hidden;margin:16px 0 26px;box-shadow:var(--sh);background:var(--code)}

.hint-content{display:none;padding:0 16px 14px;font-size:14.5px}.hint-content.open{display:block}

.tech-list{list-style:none;margin:0 0 30px;padding:0;display:flex;flex-direction:column;gap:10px}

.tech-list li::before{content:"▸";color:var(--green);flex-shrink:0}
.practice-card{margin-top:30px;background:linear-gradient(160deg,rgba(255,95,168,.07),rgba(62,224,140,.05));border:1px solid var(--line2);border-radius:14px;padding:22px 24px}
.practice-eyebrow{font-family:'Fira Code',monospace;font-size:11.5px;color:var(--mag);margin:0 0 8px}

.lesson-nav{display:flex;justify-content:space-between;align-items:center;margin:40px 44px 0;gap:10px;padding-top:20px;border-top:1px solid var(--line)}
.nav-btn{font-family:'Fira Code',monospace;font-size:13px;padding:11px 16px;border-radius:8px;cursor:pointer;border:1px solid var(--line2);background:var(--bg2);color:var(--ink)}
.nav-btn:hover:not(:disabled){border-color:var(--green);color:var(--green)}
.nav-btn.primary{background:var(--gdim);border-color:var(--green);color:var(--green)}
.nav-btn:disabled{opacity:.35;cursor:default}
@media(max-width:860px){.app{flex-direction:column}.sidebar{position:static;width:100%;height:auto;display:none}.sidebar.open{display:flex;max-height:70vh}.topbar{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:var(--bg2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;gap:10px}.topbar .brand{flex:1;min-width:0}.topbar-actions{display:flex;gap:6px}.menu-toggle{background:var(--bg3);border:1px solid var(--line2);color:var(--green);font-family:'Fira Code',monospace;font-size:12.5px;padding:8px 13px;border-radius:7px;cursor:pointer}.content-pad{padding:26px 20px 0}.status-bar{padding:13px 20px}.lesson-nav{margin:34px 20px 0}.lesson-title{font-size:22px}.bookmark-btn{width:34px;height:34px;font-size:16px}}
#matrixCanvas{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity 1.2s}
#matrixCanvas.on{opacity:.10}
#bootScreen{position:fixed;inset:0;z-index:1000;background:#05080A;color:var(--green);font-family:'Fira Code',monospace;display:flex;flex-direction:column;padding:26px;overflow:hidden;transition:opacity .5s,visibility .5s}
#bootScreen.hidden{opacity:0;visibility:hidden;pointer-events:none}
#bootLog{flex:1;overflow-y:auto;font-size:12.5px;line-height:1.9;white-space:pre-wrap}
#bootLog .ln{opacity:0;animation:lnIn .15s ease forwards}
#bootLog .ok{color:#3EE08C}#bootLog .dim{color:#4E5C58}#bootLog .warn{color:#FFC24B}#bootLog .tag{color:#FF5FA8}
@keyframes lnIn{to{opacity:1}}
#bootSkip{align-self:flex-end;margin-top:14px;background:none;border:1px solid #2A3942;color:#7E8F8A;font-family:'Fira Code',monospace;font-size:11px;padding:7px 12px;border-radius:6px;cursor:pointer}
.glitch{position:relative;display:inline-block}
.glitch.glitching::before,.glitch.glitching::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden}
.glitch.glitching::before{color:var(--mag);clip-path:inset(0 0 60% 0);animation:gT .35s steps(2,end) 2;transform:translate(-2px,-1px)}
.glitch.glitching::after{color:var(--green);clip-path:inset(60% 0 0 0);animation:gB .35s steps(2,end) 2;transform:translate(2px,1px)}
@keyframes gT{0%{transform:translate(-2px,-1px)}50%{transform:translate(3px,-2px)}100%{transform:translate(-1px,0)}}
@keyframes gB{0%{transform:translate(2px,1px)}50%{transform:translate(-3px,2px)}100%{transform:translate(1px,0)}}
.hud{display:flex;align-items:center;gap:10px;font-family:'Fira Code',monospace;font-size:10.5px;color:var(--faint);padding:10px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.hud .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);flex-shrink:0}
.hud-spacer{flex:1}
.icon-btn{background:none;border:1px solid var(--line2);color:var(--dim);width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.icon-btn:hover{color:var(--green);border-color:var(--green)}
.icon-btn.active{color:var(--green);border-color:var(--green);background:var(--gdim)}
#termLauncher{position:fixed;right:20px;bottom:20px;z-index:60;width:46px;height:46px;border-radius:10px;background:var(--bg3);border:1px solid var(--line2);color:var(--green);font-family:'Fira Code',monospace;font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--sh)}
#termLauncher .blip{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--mag);display:none}
#termPanel{position:fixed;right:20px;bottom:78px;z-index:60;width:380px;max-width:calc(100vw - 40px);height:320px;max-height:60vh;background:var(--code);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--sh);display:none;flex-direction:column;overflow:hidden;font-family:'Fira Code',monospace}
#termPanel.open{display:flex}
.term-panel-bar{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg3);border-bottom:1px solid var(--line);cursor:grab;touch-action:none}
.term-panel-bar .fname{font-size:11px;color:var(--dim)}
.term-close{background:none;border:none;color:var(--faint);cursor:pointer;font-size:13px;padding:2px 6px;margin-right:auto}
.term-close:hover{color:var(--mag)}
#termOutput{flex:1;overflow-y:auto;padding:12px 14px;font-size:12px;line-height:1.75;color:var(--ink)}
#termOutput .out-line{white-space:pre-wrap;word-break:break-word;margin-bottom:3px}
#termOutput .in-echo{color:var(--green)}#termOutput .in-echo::before{content:"$ ";color:var(--faint)}
#termOutput .out-err{color:var(--mag)}#termOutput .out-dim{color:var(--faint)}#termOutput .out-star{color:var(--amb)}
.term-panel-input{display:flex;align-items:center;gap:7px;border-top:1px solid var(--line);padding:9px 12px}
.term-panel-input .prompt{color:var(--green);font-size:12.5px}
.term-panel-input input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-family:'Fira Code',monospace;font-size:12.5px}
#toastStack{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100vw - 32px));pointer-events:none}
.toast{background:var(--bg3);border:1px solid var(--line2);border-radius:9px;padding:11px 14px;box-shadow:var(--sh);font-family:'Fira Code',monospace;font-size:12px;color:var(--ink);display:flex;gap:9px;opacity:0;transform:translateY(-10px);animation:tIn .35s ease forwards;border-right:3px solid var(--green)}
.toast.warn{border-right-color:var(--amb)}.toast.tag{border-right-color:var(--mag)}
.toast.leaving{animation:tOut .3s ease forwards}
@keyframes tIn{to{opacity:1;transform:translateY(0)}}
@keyframes tOut{to{opacity:0;transform:translateY(-8px) scale(.97)}}
@media(max-width:860px){#termPanel{right:12px;left:12px;width:auto;bottom:74px}#termLauncher{right:16px;bottom:16px}}
</style>
</head>

<script>
const COURSE=(window.RAW||[]).map(([title,file,lessons])=>({title,file,lessons:lessons.map(a=>({id:a[0],file:a[1],title:a[2],tagline:a[3],body:a[4],examples:a[5].map(e=>({label:e[0],note:e[1],code:e[2],realLabel:e[3],real:e[4]})),callout:a[6],hints:a[7],techniques:a[8],practice:a[9]}))}));
const SKEY="py-by.Patcharaphon-progress-v2",BKEY="py-by.Patcharaphon-bookmarks-v1",TKEY="py-by.Patcharaphon-theme-v1",TPKEY="py-by.Patcharaphon-term-pos-v1",CMKEY="py-by.Patcharaphon-code-mode-v1";
let currentId=(COURSE[0]&&COURSE[0].lessons[0]?COURSE[0].lessons[0].id:""),completed=[],bookmarks=[],theme="dark",navFilter="all",codeMode="single";
try{const a=localStorage.getItem(SKEY);if(a)completed=JSON.parse(a);const b=localStorage.getItem(BKEY);if(b)bookmarks=JSON.parse(b);const c=localStorage.getItem(TKEY);if(c==="light"||c==="dark")theme=c;const d=localStorage.getItem(CMKEY);if(d==="split"||d==="single")codeMode=d}catch(e){}
const saveP=()=>{try{localStorage.setItem(SKEY,JSON.stringify(completed))}catch(e){}};
const saveB=()=>{try{localStorage.setItem(BKEY,JSON.stringify(bookmarks))}catch(e){}};
const saveT=()=>{try{localStorage.setItem(TKEY,theme)}catch(e){}};
const flat=()=>COURSE.flatMap(m=>m.lessons);
const findL=id=>{for(const m of COURSE){const l=m.lessons.find(x=>x.id===id);if(l)return{lesson:l,module:m}}return null};
const mIdx=id=>COURSE.findIndex(m=>m.lessons.some(l=>l.id===id));
const isBm=id=>bookmarks.includes(id);
let openMods=new Set([mIdx(currentId)]);
function applyTheme(){document.documentElement.setAttribute("data-theme",theme);document.querySelectorAll("#themeBtn,#themeBtnMobile").forEach(b=>{b.textContent=theme==="dark"?"☀":"☾"})}
function applyCodeMode(){const s=codeMode==="split";["codeModeBtn","codeModeBtnMobile"].forEach(id=>{const b=document.getElementById(id);if(b){b.classList.toggle("active",s);b.textContent=s?"◧":"◫"}})}
function toggleTheme(){theme=theme==="dark"?"light":"dark";saveT();applyTheme();if(theme==="light"&&matrixOn)setMatrix(false);showToast({text:theme==="dark"?"โหมดมืด":"โหมดสว่าง",kind:"tag",icon:theme==="dark"?"☾":"☀"})}
function toggleCodeMode(){codeMode=codeMode==="split"?"single":"split";try{localStorage.setItem(CMKEY,codeMode)}catch(e){}applyCodeMode();renderMain();showToast({text:codeMode==="split"?"เปิดเทียบโค้ด":"ปิด",kind:"tag",icon:"◧"})}
function renderSidebar(){const nav=document.getElementById("moduleNav");nav.innerHTML="";
COURSE.forEach((m,mi)=>{const b=document.createElement("div");b.className="module-block"+(openMods.has(mi)?" open":"");
const h=document.createElement("button");h.className="module-head";
h.innerHTML=`<span class="module-caret">›</span><span class="module-head-text"><span class="module-num">${m.file}/</span><span class="module-title">${m.title}</span></span>`;
h.addEventListener("click",()=>{openMods.has(mi)?openMods.delete(mi):openMods.add(mi);renderSidebar()});
b.appendChild(h);
const ul=document.createElement("ul");ul.className="lesson-list";let vis=0;
m.lessons.forEach(l=>{const m1=navFilter==="all"||isBm(l.id);
const li=document.createElement("li");
li.className="lesson-item"+(l.id===currentId?" active":"")+(completed.includes(l.id)?" done":"")+(isBm(l.id)?" bookmarked":"");
if(!m1)li.classList.add("filtered-out");else vis++;
const btn=document.createElement("button");btn.innerHTML=`<span class="lesson-fname">${l.file}</span>`;
btn.addEventListener("click",()=>{goTo(l.id);closeMobileSidebar()});
li.appendChild(btn);ul.appendChild(li)});
if(vis===0&&navFilter==="bookmarks")b.classList.add("filtered-out");
b.appendChild(ul);nav.appendChild(b)});
const total=flat().length,done=completed.length;
document.getElementById("progressText").textContent=done+"/"+total;
document.getElementById("progressFill").style.width=(total?done/total*100:0)+"%";
const cA=document.getElementById("countAll");if(cA)cA.textContent=`(${total})`;
const cB=document.getElementById("countBookmarks");if(cB)cB.textContent=`(${bookmarks.length})`}
function renderMain(){if(!currentId)return;const f=findL(currentId);if(!f)return;const{lesson,module}=f;const mi=mIdx(currentId);const all=flat();const idx=all.findIndex(l=>l.id===currentId);
const prev=all[idx-1],next=all[idx+1],bm=isBm(lesson.id),sp=codeMode==="split";
const exHtml=lesson.examples.map(ex=>{const hR=ex.real&&ex.real.length,isS=sp&&hR;
const ep=`<div class="term-window"><div class="term-bar"><div class="term-dots"><span></span><span></span><span></span></div><span class="fname">${ex.label}</span></div><div class="term-body">${ex.code}</div></div>`;
const rp=isS?`<div class="term-window real-window"><div class="term-bar"><div class="term-dots"><span></span><span></span><span></span></div><span class="fname">${ex.realLabel||"ใช้จริง"}<span class="real-badge">REAL</span></span></div><div class="term-body">${ex.real}</div></div>`:"";
const nh=ex.note?`<p class="example-note pair-note">${ex.note}</p>`:"";
return `<div class="code-pair${isS?" split":""}">${ep}${rp}${nh}</div>`}).join("");
const tech=lesson.techniques.map(t=>`<li>${t}</li>`).join("");
const hints=(lesson.hints&&lesson.hints.length)?`<div class="hint-box"><button class="hint-toggle" id="hintToggle"><span class="arrow">›</span><span>💡 ขอคำใบ้ (${lesson.hints.length})</span></button><div class="hint-content" id="hintContent"><ol>${lesson.hints.map(h=>`<li>${h}</li>`).join("")}</ol></div></div>`:"";
document.getElementById("main").innerHTML=`
<div class="status-bar"><span>โมดูล <b>${mi+1}</b>/${COURSE.length} · บท <b>${idx+1}</b>/${all.length}</span><span>${completed.includes(lesson.id)?"● จบแล้ว":"○ ยังไม่จบ"}</span></div>
<div class="content-pad">
<p class="crumb">${module.file}<span class="sep">/</span>${lesson.file}</p>
<div class="lesson-title-row">
<h2 class="lesson-title glitch" data-text="${lesson.title}">${lesson.title}<span class="cursor"></span></h2>
<button class="bookmark-btn${bm?" active":""}" id="bookmarkBtn">${bm?"★":"☆"}</button>
</div>
<p class="lesson-tagline">${lesson.tagline}</p>
<div class="lesson-body">${lesson.body}</div>
${hints}
<p class="section-label">ตัวอย่างการใช้งาน</p>
${exHtml}
${lesson.callout?`<div class="callout"><b>⚠ จุดที่มือใหม่พลาดบ่อย</b>${lesson.callout}</div>`:""}
<p class="section-label">เทคนิคที่ควรรู้</p>
<ul class="tech-list">${tech}</ul>
<div class="practice-card"><p class="practice-eyebrow">$ ลองด้วยตัวเอง</p><p class="practice-text">${lesson.practice}</p></div>
</div>
<div class="lesson-nav">
<button class="nav-btn" id="prevBtn" ${prev?"":"disabled"}>‹ ก่อนหน้า</button>
<button class="nav-btn primary" id="doneBtn">${completed.includes(lesson.id)?"✓ จบแล้ว":"ทำเครื่องหมายว่าเรียนจบ"}</button>
<button class="nav-btn" id="nextBtn" ${next?"":"disabled"}>ถัดไป ›</button>
</div>`;
document.getElementById("bookmarkBtn").addEventListener("click",()=>{toggleBookmark(lesson.id);const now=isBm(lesson.id);const btn=document.getElementById("bookmarkBtn");btn.classList.toggle("active",now);btn.textContent=now?"★":"☆"});
const ht=document.getElementById("hintToggle");if(ht)ht.addEventListener("click",()=>{const c=document.getElementById("hintContent");const o=c.classList.toggle("open");ht.classList.toggle("open",o)});
document.getElementById("doneBtn").addEventListener("click",()=>{if(!completed.includes(lesson.id)){completed.push(lesson.id);saveP();renderSidebar();document.getElementById("doneBtn").textContent="✓ จบแล้ว";triggerGlitch(document.querySelector(".lesson-title.glitch"));showToast({text:`${lesson.file} บันทึกแล้ว`,kind:"ok",icon:"✓"})}});
if(prev)document.getElementById("prevBtn").addEventListener("click",()=>goTo(prev.id));
if(next)document.getElementById("nextBtn").addEventListener("click",()=>goTo(next.id));
attachCopy();window.scrollTo({top:0,behavior:"auto"})}
function attachCopy(){document.querySelectorAll(".term-window").forEach(w=>{const bar=w.querySelector(".term-bar"),body=w.querySelector(".term-body");if(!bar||!body||bar.querySelector(".copy-btn"))return;const b=document.createElement("button");b.className="copy-btn";b.textContent="copy";b.addEventListener("click",async()=>{const t=body.textContent;let ok=false;try{if(navigator.clipboard){await navigator.clipboard.writeText(t);ok=true}}catch(e){}if(!ok){try{const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();ok=true}catch(e){}}if(ok){b.textContent="✓";b.classList.add("ok");showToast({text:"คัดลอกแล้ว",kind:"ok",icon:"⎘"});setTimeout(()=>{b.textContent="copy";b.classList.remove("ok")},1500)}});bar.appendChild(b)})}
function toggleBookmark(id){const i=bookmarks.indexOf(id);if(i>=0){bookmarks.splice(i,1);showToast({text:"ยกเลิกปักหมุด",kind:"warn",icon:"☆"})}else{bookmarks.push(id);showToast({text:"ปักหมุดแล้ว",kind:"ok",icon:"★"})}saveB();renderSidebar();if(navFilter==="bookmarks")renderMain()}
function goTo(id){currentId=id;openMods.add(mIdx(id));renderSidebar();renderMain()}
function closeMobileSidebar(){document.getElementById("sidebar").classList.remove("open")}
document.getElementById("menuToggle").addEventListener("click",()=>document.getElementById("sidebar").classList.toggle("open"));
document.getElementById("filterAll").addEventListener("click",()=>setFilter("all"));
document.getElementById("filterBookmarks").addEventListener("click",()=>setFilter("bookmarks"));
function setFilter(f){navFilter=f;document.getElementById("filterAll").classList.toggle("active",f==="all");document.getElementById("filterBookmarks").classList.toggle("active",f==="bookmarks");if(f==="bookmarks")openMods=new Set(COURSE.map((_,i)=>i));renderSidebar()}
document.getElementById("themeBtn").addEventListener("click",toggleTheme);
document.getElementById("themeBtnMobile").addEventListener("click",toggleTheme);
document.getElementById("codeModeBtn").addEventListener("click",toggleCodeMode);
document.getElementById("codeModeBtnMobile").addEventListener("click",toggleCodeMode);
applyTheme();applyCodeMode();renderSidebar();renderMain();
function triggerGlitch(el){if(!el)return;el.classList.remove("glitching");void el.offsetWidth;el.classList.add("glitching");setTimeout(()=>el.classList.remove("glitching"),380)}
setInterval(()=>{const t=document.getElementById("brandTitle");if(t)triggerGlitch(t)},2800);
function showToast({text,kind="ok",icon="●",timeout=2400}){const s=document.getElementById("toastStack");const el=document.createElement("div");el.className="toast"+(kind==="warn"?" warn":kind==="tag"?" tag":"");el.innerHTML=`<span class="toast-ic">${icon}</span><span>${text}</span>`;s.appendChild(el);setTimeout(()=>{el.classList.add("leaving");setTimeout(()=>el.remove(),280)},timeout)}
const hudStart=performance.now();
const fc=d=>[d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,"0")).join(":");
function tickHud(){const c=document.getElementById("hudClock");if(c)c.textContent=fc(new Date());const u=document.getElementById("hudUptime");if(u){const m=Math.floor((performance.now()-hudStart)/60000),s=Math.floor((performance.now()-hudStart)%60000/1000);u.textContent=m>0?`${m}m ${s}s`:`${s}s`}}
tickHud();setInterval(tickHud,1000);
const matrixCanvas=document.getElementById("matrixCanvas"),mctx=matrixCanvas.getContext("2d");let matrixOn=false,matrixCols=[];
const mchars="アイウエオカキクケコ01ABCDEFGHIJKLMNOPQRSTUVWXYZ$#@%+-<>/{}[]()".split("");
function resizeMatrix(){matrixCanvas.width=innerWidth;matrixCanvas.height=innerHeight;matrixCols=new Array(Math.ceil(matrixCanvas.width/15)).fill(0).map(()=>Math.floor(Math.random()*-40))}
addEventListener("resize",resizeMatrix);resizeMatrix();
function drawMatrix(){if(!matrixOn)return;mctx.fillStyle="rgba(5,8,10,0.14)";mctx.fillRect(0,0,matrixCanvas.width,matrixCanvas.height);mctx.font="15px 'Fira Code',monospace";for(let i=0;i<matrixCols.length;i++){const ch=mchars[Math.floor(Math.random()*mchars.length)],x=i*15,y=matrixCols[i]*15;mctx.fillStyle=Math.random()<.04?"#D9E6E0":"#3EE08C";mctx.fillText(ch,x,y);if(y>matrixCanvas.height&&Math.random()>.975)matrixCols[i]=0;matrixCols[i]++}requestAnimationFrame(drawMatrix)}
function setMatrix(on){matrixOn=on;matrixCanvas.classList.toggle("on",on);if(on){mctx.fillStyle="#05080A";mctx.fillRect(0,0,matrixCanvas.width,matrixCanvas.height);drawMatrix()}}
const BOOT_LINES=[{t:"dim",m:"[ init ] loading python-from-zero..."},{t:"ok",m:"[  OK  ] 21 modules detected"},{t:"tag",m:"[ INFO ] instructor: by.Patcharaphon"},{t:"ok",m:"ACCESS GRANTED — ยินดีต้อนรับ"}];
function runBoot(){const boot=document.getElementById("bootScreen"),log=document.getElementById("bootLog"),skip=document.getElementById("bootSkip");
if(sessionStorage.getItem("py-boot-seen")){boot.classList.add("hidden");return}
let i=0,finished=false;
function finishBoot(){if(finished)return;finished=true;sessionStorage.setItem("py-boot-seen","1");boot.classList.add("hidden");setTimeout(()=>showToast({text:"พร้อมใช้งาน",kind:"tag",icon:"⌁",timeout:1500}),400)}
function nextLine(){if(finished)return;if(i>=BOOT_LINES.length){setTimeout(finishBoot,400);return}const item=BOOT_LINES[i++];const div=document.createElement("div");div.className="ln "+item.t;div.textContent=item.m;log.appendChild(div);log.scrollTop=log.scrollHeight;setTimeout(nextLine,60+Math.random()*40)}
nextLine();skip.addEventListener("click",finishBoot);document.addEventListener("keydown",finishBoot,{once:true});boot.addEventListener("click",finishBoot)}
runBoot();
const termPanel=document.getElementById("termPanel"),termOutput=document.getElementById("termOutput"),termInput=document.getElementById("termInput"),termBlip=document.getElementById("termBlip");
let termOpenedOnce=false,pendingQuiz=null;
function termPrint(t,c){const d=document.createElement("div");d.className="out-line"+(c?" "+c:"");d.textContent=t;termOutput.appendChild(d);termOutput.scrollTop=termOutput.scrollHeight}
function termPrintEcho(t){const d=document.createElement("div");d.className="out-line in-echo";d.textContent=t;termOutput.appendChild(d);termOutput.scrollTop=termOutput.scrollHeight}
function openTerm(){termPanel.classList.add("open");termBlip.style.display="none";if(!termOpenedOnce){termOpenedOnce=true;termPrint("terminal — พิมพ์ 'help'","out-dim")}setTimeout(()=>termInput.focus(),50)}
function closeTerm(){termPanel.classList.remove("open")}
document.getElementById("termLauncher").addEventListener("click",()=>termPanel.classList.contains("open")?closeTerm():openTerm());
document.getElementById("termClose").addEventListener("click",closeTerm);
document.addEventListener("keydown",e=>{if(e.key==="`"&&document.activeElement!==termInput){e.preventDefault();termPanel.classList.contains("open")?closeTerm():openTerm()}if(e.key==="Escape"&&termPanel.classList.contains("open"))closeTerm()});
const TERM_HELP=["help — คำสั่ง","ls — โมดูล","progress — ความคืบหน้า","cat <id> — โค้ด","search <คำ>","quiz","hint","bookmarks","bookmark [id]","theme dark|light","matrix on|off","goto <id>","reset yes","clear","exit"];
const QUIZ=[{q:"คอมเมนต์?",a:"#"},{q:"รับข้อมูล?",a:"input"},{q:"index แรก?",a:"0"},{q:"ฟังก์ชัน?",a:"def"},{q:"type True/False?",a:"bool"},{q:"พิมพ์จอ?",a:"print"},{q:"len list?",a:"len"},{q:"คลาส?",a:"class"}];
function stripH(h){return h.replace(/<[^>]+>/g,"").replace(/&lt;/g,"<").replace(/&gt;/g,">").replace(/&quot;/g,'"').replace(/&amp;/g,"&")}
function handleTerm(raw){const cmd=raw.trim();termPrintEcho(cmd);if(!cmd)return;
if(pendingQuiz){const a=cmd.toLowerCase();if(a==="skip"){termPrint(`ข้าม — "${pendingQuiz.a}"`,"out-dim");pendingQuiz=null;return}if(a===pendingQuiz.a.toLowerCase()){termPrint("✓ ถูก!","out-dim");showToast({text:"ตอบถูก! 🎯",kind:"tag",icon:"✓"});pendingQuiz=null;return}termPrint("✗ ยังไม่ถูก หรือ 'skip'","out-err");return}
const [w,...r]=cmd.split(/\s+/),arg=r.join(" ");
switch(w.toLowerCase()){
case "help":TERM_HELP.forEach(l=>termPrint(l,"out-dim"));break;
case "ls":COURSE.forEach(m=>termPrint(m.file+"/  "+m.title));break;
case "progress":{const t=flat().length,d=completed.length;termPrint(`เรียน ${d}/${t}`);termPrint(`ปักหมุด ${bookmarks.length}`,"out-star");break}
case "clear":termOutput.innerHTML="";break;
case "cat":{if(!arg){termPrint("cat <id>","out-err");break}const f=findL(arg);if(!f){termPrint(`ไม่พบ`,"out-err");break}termPrint(`// ${f.lesson.id}`,"out-dim");f.lesson.examples.forEach(ex=>{termPrint(`--- ${ex.label} ---`,"out-dim");stripH(ex.code).split("\n").forEach(l=>termPrint(l))});break}
case "search":{if(!arg){termPrint("search <คำ>","out-err");break}const q=arg.toLowerCase(),hits=[];COURSE.forEach(m=>m.lessons.forEach(l=>{if((l.title+" "+l.tagline).toLowerCase().includes(q))hits.push(l)}));if(!hits.length){termPrint("ไม่พบ","out-dim");break}termPrint(`พบ ${hits.length}:`,"out-dim");hits.forEach(l=>termPrint(`${l.id}  ${l.title}`));break}
case "quiz":{const p=QUIZ[Math.floor(Math.random()*QUIZ.length)];pendingQuiz=p;termPrint(`❓ ${p.q}`);termPrint("   พิมพ์คำตอบ หรือ 'skip'","out-dim");break}
case "hint":{const f=findL(currentId);if(f&&f.lesson.hints){termPrint(`💡`,"out-dim");f.lesson.hints.forEach((h,i)=>termPrint(`  ${i+1}. ${h}`))}else termPrint("ไม่มีคำใบ้","out-dim");break}
case "bookmarks":{if(!bookmarks.length){termPrint("ยังไม่มี","out-dim");break}bookmarks.forEach(id=>{const f=findL(id);if(f)termPrint(`  ${id}  ${f.lesson.title}`,"out-star")});break}
case "bookmark":{const t=arg||currentId,f=findL(t);if(!f){termPrint("ไม่พบ","out-err");break}toggleBookmark(t);break}
case "theme":if(arg==="dark"||arg==="light"){if(theme!==arg){theme=arg;saveT();applyTheme();if(arg==="light"&&matrixOn)setMatrix(false)}termPrint(`โหมด ${arg}`)}else termPrint("theme dark / light","out-err");break;
case "matrix":if(arg==="off"){setMatrix(false);termPrint("ปิด","out-dim")}else if(theme==="light")termPrint("โหมดสว่างไม่รองรับ","out-err");else{setMatrix(true);termPrint("เปิด","out-dim")}break;
case "goto":{const f=findL(arg);if(f){goTo(arg);termPrint(`ไป ${arg}`);closeMobileSidebar()}else termPrint("ไม่พบ","out-err");break}
case "reset":if(arg==="yes"){completed=[];bookmarks=[];saveP();saveB();renderSidebar();renderMain();termPrint("ล้างแล้ว","out-dim");showToast({text:"รีเซ็ต",kind:"warn",icon:"⟲"})}else termPrint("reset yes","out-err");break;
case "exit":closeTerm();break;
case "echo":termPrint(arg);break;
default:termPrint(`command not found: ${w}`,"out-err")}}
termInput.addEventListener("keydown",e=>{if(e.key==="Enter"&&termInput.value.trim()!==""){handleTerm(termInput.value);termInput.value=""}});
const termBar=termPanel.querySelector(".term-panel-bar");let dragState=null;
function startDrag(cx,cy){const r=termPanel.getBoundingClientRect();dragState={offX:cx-r.left,offY:cy-r.top};termPanel.style.right="auto";termPanel.style.bottom="auto";termPanel.style.left=r.left+"px";termPanel.style.top=r.top+"px";termPanel.classList.add("dragged");termBar.classList.add("dragging");document.body.style.userSelect="none"}
function moveDrag(cx,cy){if(!dragState)return;let l=cx-dragState.offX,t=cy-dragState.offY;l=Math.max(0,Math.min(l,innerWidth-termPanel.offsetWidth));t=Math.max(0,Math.min(t,innerHeight-termPanel.offsetHeight));termPanel.style.left=l+"px";termPanel.style.top=t+"px"}
function endDrag(){if(!dragState)return;dragState=null;termBar.classList.remove("dragging");document.body.style.userSelect="";try{localStorage.setItem(TPKEY,JSON.stringify({left:termPanel.style.left,top:termPanel.style.top}))}catch(e){}}
termBar.addEventListener("mousedown",e=>{if(e.target.closest("button"))return;e.preventDefault();startDrag(e.clientX,e.clientY)});
document.addEventListener("mousemove",e=>moveDrag(e.clientX,e.clientY));
document.addEventListener("mouseup",endDrag);
termBar.addEventListener("touchstart",e=>{if(e.target.closest("button"))return;const t=e.touches[0];startDrag(t.clientX,t.clientY)},{passive:true});
document.addEventListener("touchmove",e=>{if(!dragState)return;const t=e.touches[0];moveDrag(t.clientX,t.clientY)},{passive:true});
document.addEventListener("touchend",endDrag);
try{const s=JSON.parse(localStorage.getItem(TPKEY)||"null");if(s&&s.left){termPanel.style.right="auto";termPanel.style.bottom="auto";termPanel.style.left=s.left;termPanel.style.top=s.top;termPanel.classList.add("dragged")}}catch(e){}
setTimeout(()=>{if(!termPanel.classList.contains("open"))termBlip.style.display="block"},4000);
</script>
</body>
</html>
